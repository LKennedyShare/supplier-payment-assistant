name: Supplier buyer tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --index-url https://pypi.org/simple ".[test,langchain,openai]"
      - run: python -m pytest -q
      - run: supplier-payment-assistant --demo
      - run: python examples/framework_demo.py --framework langchain
      - run: python examples/framework_demo.py --framework openai
